upstream_project_url: https://github.com/nikromen/dirstory
specfile_path: packaging/rpm/dirstory.spec
upstream_package_name: dirstory
downstream_package_name: dirstory
upstream_tag_template: dirstory-{version}

jobs:
  - job: copr_build
    trigger: pull_request
    enable_net: true
    targets:
      - fedora-all

  - job: tests
    trigger: pull_request
    targets:
      - fedora-all

  - job: copr_build
    trigger: commit
    enable_net: true
    branch: main
    targets:
      - fedora-all
    owner: nikromen
    project: dirstory
    list_on_homepage: true
    preserve_project: true
    actions:
      post-modifications:
        - bash -c "sed -i '1i%global git_build 1' packaging/rpm/dirstory.spec"

  - job: tests
    trigger: commit
    branch: main
    targets:
      - fedora-all

  - job: copr_build
    trigger: release
    enable_net: true
    targets:
      - fedora-all
    owner: nikromen
    project: dirstory
    list_on_homepage: true
    preserve_project: true
